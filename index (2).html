<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bomber Man Classic - Ultimate Edition</title>
    <!-- Tailwind CSS for basic layout and typography -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --grid-size: 15;
            --cell-size: 40px;
            --wall-color: #5d4037;
            --floor-color: #8d6e63;
            --destructible-color: #795548;
            --player-color: #2196F3;
            --enemy-color: #f44336;
            --bomb-color: #212121;
            --explosion-color: #ffeb3b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
            color: white;
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            touch-action: none; /* Prevent default touch actions on mobile */
        }

        #game-container {
            position: relative;
            background-color: var(--floor-color);
            border: 10px solid #3e2723;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
            /* Calculate dimensions based on grid */
            width: calc(var(--grid-size) * var(--cell-size));
            height: calc(var(--grid-size) * var(--cell-size));
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            image-rendering: pixelated; /* Crisp look for classic style */
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
            box-sizing: border-box;
            z-index: 10;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 1px 1px 2px black;
            border: 2px solid #555;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .stat-icon {
            font-size: 1.5rem;
        }

        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto; /* Catch clicks */
            z-index: 20;
            backdrop-filter: blur(5px);
            transition: opacity 0.3s ease;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .game-title {
            font-size: 4rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 
                3px 3px 0 #f44336,
                -1px -1px 0 #ffeb3b,  
                1px -1px 0 #ffeb3b,
                -1px 1px 0 #ffeb3b,
                1px 1px 0 #ffeb3b,
                0px 6px 15px rgba(0,0,0,0.8);
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-align: center;
        }

        .btn {
            background: linear-gradient(145deg, #4CAF50, #45a049);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #2e7d32, 0 10px 15px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 10px;
        }

        .btn:hover {
            transform: translateY(2px);
            box-shadow: 0 4px 0 #2e7d32, 0 8px 10px rgba(0,0,0,0.5);
            background: linear-gradient(145deg, #45a049, #4CAF50);
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #2e7d32, 0 4px 5px rgba(0,0,0,0.5);
        }

        .message-text {
            font-size: 2rem;
            color: white;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px black;
        }

        #mobile-controls {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: none; /* Hidden by default, shown via JS if touch detected */
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 30;
            pointer-events: none;
        }

        .d-pad, .action-buttons {
            pointer-events: auto;
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 5px;
        }

        .action-buttons {
            display: flex;
            align-items: flex-end;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: white;
            user-select: none;
            touch-action: manipulation;
        }
        
        .control-btn:active {
            background: rgba(255, 255, 255, 0.4);
        }

        .d-up { grid-column: 2; grid-row: 1; }
        .d-left { grid-column: 1; grid-row: 2; }
        .d-right { grid-column: 3; grid-row: 2; }
        .d-down { grid-column: 2; grid-row: 3; }

        .btn-bomb {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(244, 67, 54, 0.5);
            border: 3px solid rgba(244, 67, 54, 0.8);
            margin-bottom: 30px;
            font-weight: bold;
        }
        .btn-bomb:active { background: rgba(244, 67, 54, 0.8); }

        /* Media query for smaller screens */
        @media (max-width: 700px) {
            :root {
                --cell-size: 25px; /* Smaller cells on mobile */
            }
            .game-title { font-size: 2.5rem; }
            .btn { padding: 10px 25px; font-size: 1.2rem; }
        }
        
        /* Particle effects container overlay */
        #particles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- The main rendering canvas -->
        <canvas id="gameCanvas"></canvas>
        
        <!-- Overlay for CSS-based particle effects (explosions) -->
        <div id="particles-container"></div>

        <!-- UI Elements: Score, Lives -->
        <div id="ui-layer">
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-icon">❤️</span> <span id="lives-display">3</span>
                </div>
                <div class="stat-item" style="color: #4CAF50;">
                    <span class="stat-icon">SCORE</span> <span id="score-display">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-icon">💣</span> <span id="bomb-display">1</span>
                </div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="overlay-screen">
            <h1 class="game-title">BOMBER MAN<br><span style="font-size: 0.5em; color: #aaa; text-shadow: none;">ULTIMATE</span></h1>
            <p class="text-gray-300 mb-8 text-center px-4">Use Arrow Keys / WASD to move.<br>Spacebar to drop bombs.<br>Destroy blocks, avoid enemies, find the exit!</p>
            <button id="start-btn" class="btn">Start Game</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="overlay-screen hidden">
            <h1 class="game-title" style="color: #f44336; text-shadow: 2px 2px 0 #000;">GAME OVER</h1>
            <p id="final-score" class="message-text">Score: 0</p>
            <button id="restart-btn" class="btn">Play Again</button>
        </div>
        
        <!-- Level Complete Screen -->
        <div id="level-complete-screen" class="overlay-screen hidden">
            <h1 class="game-title" style="color: #4CAF50; text-shadow: 2px 2px 0 #000;">LEVEL CLEARED!</h1>
            <p class="message-text">Great Job!</p>
            <button id="next-level-btn" class="btn">Next Level</button>
        </div>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="mobile-controls">
        <div class="d-pad">
            <div class="control-btn d-up" id="btn-up">▲</div>
            <div class="control-btn d-left" id="btn-left">◀</div>
            <div class="control-btn d-right" id="btn-right">▶</div>
            <div class="control-btn d-down" id="btn-down">▼</div>
        </div>
        <div class="action-buttons">
            <div class="control-btn btn-bomb" id="btn-bomb-mobile">BOMB</div>
        </div>
    </div>

    <script>
        // Constants
        const TILE_EMPTY = 0;
        const TILE_WALL = 1;     // Indestructible
        const TILE_BLOCK = 2;    // Destructible
        const TILE_BOMB = 3;
        const TILE_EXPLOSION = 4;
        const TILE_EXIT = 5;
        const TILE_POWERUP_BOMB = 6;
        const TILE_POWERUP_FLAME = 7;

        // Game Configuration
        let GRID_SIZE = 15; // Must be odd for classic grid
        let CELL_SIZE = 40;
        
        // Dynamic configuration based on screen size
        function calculateLayout() {
            const minDimension = Math.min(window.innerWidth, window.innerHeight) - 40; // 40px margin
            
            // Adjust cell size based on screen, max 40
            CELL_SIZE = Math.min(40, Math.floor(minDimension / GRID_SIZE));
            
            // Update CSS variables
            document.documentElement.style.setProperty('--cell-size', `${CELL_SIZE}px`);
            
            // Re-size canvas
            if(canvas) {
                canvas.width = GRID_SIZE * CELL_SIZE;
                canvas.height = GRID_SIZE * CELL_SIZE;
            }
        }

        // Globals
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const particlesContainer = document.getElementById('particles-container');
        
        let map = [];
        let entities = []; // Enemies
        let bombs = [];
        let explosions = [];
        let powerups = [];
        let particles = [];
        let exitPos = { x: -1, y: -1, revealed: false };
        
        let animationId;
        let lastTime = 0;
        let gameState = 'START'; // START, PLAYING, GAMEOVER, LEVELCOMPLETE
        
        // Player Stats
        let player = {
            x: 1, y: 1,
            width: 0.8, height: 0.8, // relative to cell size
            speed: 3, // pixels per frame roughly
            maxBombs: 1,
            flameLength: 1,
            lives: 3,
            score: 0,
            direction: 'down',
            isMoving: false,
            invulnerableTime: 0,
            dead: false
        };

        let currentLevel = 1;

        // Inputs
        const keys = {
            ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false,
            w: false, s: false, a: false, d: false,
            ' ': false
        };

        function init() {
            calculateLayout();
            window.addEventListener('resize', calculateLayout);
            setupInputBindings();
            
            // Show touch controls if on mobile
            if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
                document.getElementById('mobile-controls').style.display = 'flex';
            }
        }

        function resetGame() {
            player.lives = 3;
            player.score = 0;
            player.maxBombs = 1;
            player.flameLength = 1;
            currentLevel = 1;
            updateUI();
            startLevel();
        }

        function startLevel() {
            // Reset player position and state
            player.x = 1;
            player.y = 1;
            player.dead = false;
            player.invulnerableTime = 2000; // 2 seconds invulnerability
            player.direction = 'down';
            
            bombs = [];
            explosions = [];
            powerups = [];
            entities = [];
            particles = [];
            particlesContainer.innerHTML = ''; // Clear DOM particles
            exitPos = { x: -1, y: -1, revealed: false };

            generateMap();
            spawnEnemies();
            
            gameState = 'PLAYING';
            hideScreens();
            
            lastTime = performance.now();
            if (animationId) cancelAnimationFrame(animationId);
            gameLoop(lastTime);
        }

        function generateMap() {
            map = [];
            for (let y = 0; y < GRID_SIZE; y++) {
                let row = [];
                for (let x = 0; x < GRID_SIZE; x++) {
                    // Borders and fixed pillars
                    if (x === 0 || x === GRID_SIZE - 1 || y === 0 || y === GRID_SIZE - 1 || (x % 2 === 0 && y % 2 === 0)) {
                        row.push(TILE_WALL);
                    } 
                    // Safe zone for player start
                    else if ((x === 1 && y === 1) || (x === 1 && y === 2) || (x === 2 && y === 1)) {
                        row.push(TILE_EMPTY);
                    }
                    // Random destructible blocks
                    else if (Math.random() < 0.6) {
                        row.push(TILE_BLOCK);
                    } 
                    // Empty space
                    else {
                        row.push(TILE_EMPTY);
                    }
                }
                map.push(row);
            }

            // Hide Exit under a random block
            let blockPositions = [];
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    if (map[y][x] === TILE_BLOCK) {
                        blockPositions.push({x, y});
                    }
                }
            }

            // Shuffle blocks
            blockPositions.sort(() => Math.random() - 0.5);

            if (blockPositions.length > 0) {
                let exitPosData = blockPositions.pop();
                exitPos = { x: exitPosData.x, y: exitPosData.y, revealed: false };
                
                // Hide Powerups under other blocks
                const numPowerups = Math.min(3, blockPositions.length);
                for(let i=0; i<numPowerups; i++) {
                    let pos = blockPositions.pop();
                    let type = Math.random() > 0.5 ? TILE_POWERUP_BOMB : TILE_POWERUP_FLAME;
                    powerups.push({ x: pos.x, y: pos.y, type: type, revealed: false });
                }
            }
        }

        function spawnEnemies() {
            const numEnemies = Math.min(currentLevel + 2, 8); // Max 8 enemies
            let attempts = 0;
            
            while (entities.length < numEnemies && attempts < 100) {
                let rx = Math.floor(Math.random() * GRID_SIZE);
                let ry = Math.floor(Math.random() * GRID_SIZE);
                
                // Don't spawn near player start (top left 4x4)
                if (rx < 4 && ry < 4) continue;
                
                if (map[ry][rx] === TILE_EMPTY) {
                    entities.push({
                        x: rx,
                        y: ry,
                        width: 0.7, height: 0.7,
                        speed: 1.5 + (currentLevel * 0.2), // Faster each level
                        direction: Math.random() > 0.5 ? 'h' : 'v', // horizontal or vertical preferred
                        velX: 0, velY: 0,
                        type: 'balloon', // simple enemy
                        dead: false
                    });
                }
                attempts++;
            }
        }

        function setupInputBindings() {
            // Keyboard
            window.addEventListener('keydown', (e) => {
                if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
                // Prevent scrolling with space/arrows
                if(["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
                    e.preventDefault();
                }
                if (e.key === ' ' && gameState === 'PLAYING') placeBomb();
            });

            window.addEventListener('keyup', (e) => {
                if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
            });

            // UI Buttons
            document.getElementById('start-btn').addEventListener('click', resetGame);
            document.getElementById('restart-btn').addEventListener('click', resetGame);
            document.getElementById('next-level-btn').addEventListener('click', () => {
                currentLevel++;
                startLevel();
            });

            // Mobile Controls Setup
            const bindTouch = (btnId, keyEquiv, action) => {
                const btn = document.getElementById(btnId);
                if(!btn) return;
                
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if(action) action();
                    else keys[keyEquiv] = true;
                }, {passive: false});
                
                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    if(!action) keys[keyEquiv] = false;
                }, {passive: false});
            };

            bindTouch('btn-up', 'ArrowUp');
            bindTouch('btn-down', 'ArrowDown');
            bindTouch('btn-left', 'ArrowLeft');
            bindTouch('btn-right', 'ArrowRight');
            bindTouch('btn-bomb-mobile', null, () => {
                if (gameState === 'PLAYING') placeBomb();
            });
        }

        function getCell(x, y) {
            let cx = Math.floor(x);
            let cy = Math.floor(y);
            if (cx < 0 || cx >= GRID_SIZE || cy < 0 || cy >= GRID_SIZE) return TILE_WALL;
            return map[cy][cx];
        }

        // AABB Collision detection adjusted for grid
        function rectIntersect(x1, y1, w1, h1, x2, y2, w2, h2) {
            return x2 < x1 + w1 && x2 + w2 > x1 && y2 < y1 + h1 && y2 + h2 > y1;
        }

        function checkMapCollision(x, y, width, height, ignoreBomb = false) {
            // Check the 4 corners of the entity against the grid
            const margin = 0.05; // slight tolerance to allow sliding around corners
            const corners = [
                { cx: Math.floor(x + margin), cy: Math.floor(y + margin) }, // TL
                { cx: Math.floor(x + width - margin), cy: Math.floor(y + margin) }, // TR
                { cx: Math.floor(x + margin), cy: Math.floor(y + height - margin) }, // BL
                { cx: Math.floor(x + width - margin), cy: Math.floor(y + height - margin) } // BR
            ];

            for (let c of corners) {
                let tile = getCell(c.cx, c.cy);
                if (tile === TILE_WALL || tile === TILE_BLOCK) return true;
                
                // Bomb collision logic: players can walk off bombs they just placed, but not back onto them
                if (tile === TILE_BOMB && !ignoreBomb) {
                    // Check if center of player is fully outside the bomb center
                    let pCenterX = x + width/2;
                    let pCenterY = y + height/2;
                    let bCenterX = c.cx + 0.5;
                    let bCenterY = c.cy + 0.5;
                    let distSq = (pCenterX - bCenterX)**2 + (pCenterY - bCenterY)**2;
                    
                    // If far enough from bomb center, it's solid
                    if(distSq > 0.6) return true; 
                }
            }
            return false;
        }

        function updatePlayer(dt) {
            if (player.dead) return;

            let moveSpeed = (player.speed * dt) / 1000; // Convert speed to grid units per second
            let dx = 0;
            let dy = 0;
            player.isMoving = false;

            if (keys.ArrowUp || keys.w) { dy -= moveSpeed; player.direction = 'up'; player.isMoving = true; }
            if (keys.ArrowDown || keys.s) { dy += moveSpeed; player.direction = 'down'; player.isMoving = true; }
            if (keys.ArrowLeft || keys.a) { dx -= moveSpeed; player.direction = 'left'; player.isMoving = true; }
            if (keys.ArrowRight || keys.d) { dx += moveSpeed; player.direction = 'right'; player.isMoving = true; }

            // Normalize diagonal movement
            if (dx !== 0 && dy !== 0) {
                const length = Math.sqrt(dx * dx + dy * dy);
                dx = (dx / length) * moveSpeed;
                dy = (dy / length) * moveSpeed;
            }
            
            // Corner sliding mechanic (makes movement feel better)
            const slideThreshold = 0.3;
            
            // X Movement
            if (dx !== 0) {
                if (!checkMapCollision(player.x + dx, player.y, player.width, player.height, true)) {
                    player.x += dx;
                } else {
                    // Try sliding y if blocked on x
                    let gridY = Math.round(player.y);
                    let diffY = gridY - player.y;
                    if (Math.abs(diffY) > 0 && Math.abs(diffY) < slideThreshold) {
                         player.y += Math.sign(diffY) * moveSpeed;
                    }
                }
            }
            // Y Movement
            if (dy !== 0) {
                if (!checkMapCollision(player.x, player.y + dy, player.width, player.height, true)) {
                    player.y += dy;
                } else {
                    // Try sliding x if blocked on y
                    let gridX = Math.round(player.x);
                    let diffX = gridX - player.x;
                    if (Math.abs(diffX) > 0 && Math.abs(diffX) < slideThreshold) {
                         player.x += Math.sign(diffX) * moveSpeed;
                    }
                }
            }

            // Keep within bounds
            player.x = Math.max(0, Math.min(player.x, GRID_SIZE - player.width));
            player.y = Math.max(0, Math.min(player.y, GRID_SIZE - player.height));

            // Powerup collection
            let pGridX = Math.floor(player.x + player.width/2);
            let pGridY = Math.floor(player.y + player.height/2);
            
            for (let i = powerups.length - 1; i >= 0; i--) {
                let p = powerups[i];
                if (p.revealed && pGridX === p.x && pGridY === p.y) {
                    if (p.type === TILE_POWERUP_BOMB) player.maxBombs++;
                    if (p.type === TILE_POWERUP_FLAME) player.flameLength++;
                    player.score += 50;
                    powerups.splice(i, 1);
                    createTextEffect(p.x, p.y, "POWER UP!", "#4CAF50");
                    updateUI();
                }
            }
            
            // Exit Check
            if (exitPos.revealed && pGridX === exitPos.x && pGridY === exitPos.y) {
                if(entities.length === 0) {
                    levelComplete();
                }
            }

            // Invulnerability timer
            if (player.invulnerableTime > 0) {
                player.invulnerableTime -= dt;
            }
        }

        function placeBomb() {
            if (player.dead) return;
            
            let activeBombs = bombs.length;
            if (activeBombs >= player.maxBombs) return;

            // Snap bomb to grid center based on player center
            let bx = Math.floor(player.x + player.width / 2);
            let by = Math.floor(player.y + player.height / 2);

            // Don't place if already a bomb there
            if (map[by][bx] === TILE_BOMB) return;

            map[by][bx] = TILE_BOMB;
            bombs.push({
                x: bx, y: by,
                timer: 3000, // 3 seconds to explode
                flameLength: player.flameLength,
                breatheOffset: 0
            });
            updateUI();
        }

        function updateBombs(dt) {
            for (let i = bombs.length - 1; i >= 0; i--) {
                let b = bombs[i];
                b.timer -= dt;
                b.breatheOffset += dt * 0.01; // For animation
                
                if (b.timer <= 0) {
                    explodeBomb(i);
                }
            }
        }

        function explodeBomb(index) {
            let b = bombs.splice(index, 1)[0];
            map[b.y][b.x] = TILE_EMPTY;
            
            let explCenter = { x: b.x, y: b.y, timer: 500, cells: [] };
            explCenter.cells.push({ x: b.x, y: b.y, type: 'center' });
            
            // Create explosion in 4 directions
            const dirs = [ {dx: 0, dy: -1, type: 'v'}, {dx: 0, dy: 1, type: 'v'}, {dx: -1, dy: 0, type: 'h'}, {dx: 1, dy: 0, type: 'h'} ];
            
            for (let d of dirs) {
                for (let i = 1; i <= b.flameLength; i++) {
                    let ex = b.x + (d.dx * i);
                    let ey = b.y + (d.dy * i);
                    
                    if (ex < 0 || ex >= GRID_SIZE || ey < 0 || ey >= GRID_SIZE) break; // Bounds check
                    
                    let cell = map[ey][ex];
                    
                    if (cell === TILE_WALL) break; // Stops at wall
                    
                    let cellType = i === b.flameLength ? (d.dx !== 0 ? 'h-end' : 'v-end') : d.type;
                    
                    if (cell === TILE_BLOCK) {
                        // Destroy block, create particles, stop explosion
                        map[ey][ex] = TILE_EMPTY;
                        explCenter.cells.push({ x: ex, y: ey, type: cellType });
                        createDebris(ex, ey);
                        player.score += 10;
                        
                        // Reveal hidden items
                        if (ex === exitPos.x && ey === exitPos.y) exitPos.revealed = true;
                        for(let p of powerups) {
                            if (p.x === ex && p.y === ey) p.revealed = true;
                        }
                        break;
                    }
                    
                    if (cell === TILE_BOMB) {
                        // Chain reaction: find bomb and set timer to 0
                        let chainBomb = bombs.findIndex(bm => bm.x === ex && bm.y === ey);
                        if(chainBomb > -1) bombs[chainBomb].timer = 50; // Explode almost immediately
                        break;
                    }

                    explCenter.cells.push({ x: ex, y: ey, type: cellType });
                }
            }
            
            explosions.push(explCenter);
            createScreenShake();
            updateUI();
        }

        function updateExplosions(dt) {
            for (let i = explosions.length - 1; i >= 0; i--) {
                let e = explosions[i];
                e.timer -= dt;
                
                // Damage Logic
                if (e.timer > 200) { // Only do damage in the first part of explosion
                    for (let cell of e.cells) {
                        // Check Enemy hit
                        for (let j = entities.length - 1; j >= 0; j--) {
                            let en = entities[j];
                            if (!en.dead && rectIntersect(cell.x, cell.y, 1, 1, en.x, en.y, en.width, en.height)) {
                                en.dead = true;
                                player.score += 100;
                                createTextEffect(en.x, en.y, "100", "#ffeb3b");
                                entities.splice(j, 1);
                                updateUI();
                            }
                        }

                        // Check Player hit
                        if (!player.dead && player.invulnerableTime <= 0) {
                            let pMargin = 0.2; // smaller hitbox for player
                            if (rectIntersect(cell.x, cell.y, 1, 1, player.x + pMargin, player.y + pMargin, player.width - pMargin*2, player.height - pMargin*2)) {
                                killPlayer();
                            }
                        }
                    }
                }

                if (e.timer <= 0) {
                    explosions.splice(i, 1);
                }
            }
        }

        function updateEnemies(dt) {
            for (let en of entities) {
                if (en.dead) continue;
                
                let moveSpeed = (en.speed * dt) / 1000;
                
                // Simple AI: Move straight, turn randomly at intersections or walls
                let canMove = true;
                
                if (en.direction === 'h') {
                    en.velX = moveSpeed * (en.speedDir || 1);
                    en.velY = 0;
                    if (checkMapCollision(en.x + en.velX, en.y, en.width, en.height)) {
                        canMove = false;
                    }
                } else {
                    en.velX = 0;
                    en.velY = moveSpeed * (en.speedDir || 1);
                    if (checkMapCollision(en.x, en.y + en.velY, en.width, en.height)) {
                        canMove = false;
                    }
                }
                
                // If blocked, or randomly (to simulate intelligence) change direction
                if (!canMove || Math.random() < 0.02) {
                    // Snap to grid slightly to help turning
                    en.x = Math.round(en.x);
                    en.y = Math.round(en.y);
                    
                    let possibleDirs = [];
                    // check adjacent cells
                    let cx = Math.floor(en.x + 0.5);
                    let cy = Math.floor(en.y + 0.5);
                    
                    if (getCell(cx, cy-1) === TILE_EMPTY) possibleDirs.push({d:'v', s:-1});
                    if (getCell(cx, cy+1) === TILE_EMPTY) possibleDirs.push({d:'v', s:1});
                    if (getCell(cx-1, cy) === TILE_EMPTY) possibleDirs.push({d:'h', s:-1});
                    if (getCell(cx+1, cy) === TILE_EMPTY) possibleDirs.push({d:'h', s:1});
                    
                    if(possibleDirs.length > 0) {
                        let choice = possibleDirs[Math.floor(Math.random() * possibleDirs.length)];
                        en.direction = choice.d;
                        en.speedDir = choice.s;
                    } else {
                        en.speedDir *= -1; // Reverse if trapped
                    }
                } else {
                    en.x += en.velX;
                    en.y += en.velY;
                }

                // Player collision
                if (!player.dead && player.invulnerableTime <= 0) {
                    let pMargin = 0.2;
                    if (rectIntersect(en.x, en.y, en.width, en.height, player.x + pMargin, player.y + pMargin, player.width - pMargin*2, player.height - pMargin*2)) {
                        killPlayer();
                    }
                }
            }
        }

        function killPlayer() {
            player.dead = true;
            createDebris(player.x, player.y, player.color);
            
            setTimeout(() => {
                player.lives--;
                if (player.lives <= 0) {
                    gameOver();
                } else {
                    // Respawn
                    player.x = 1;
                    player.y = 1;
                    player.dead = false;
                    player.invulnerableTime = 3000;
                    updateUI();
                }
            }, 1000);
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            document.getElementById('game-over-screen').classList.remove('hidden');
            document.getElementById('final-score').innerText = `Final Score: ${player.score}`;
        }

        function levelComplete() {
            gameState = 'LEVELCOMPLETE';
            document.getElementById('level-complete-screen').classList.remove('hidden');
            player.score += 1000; // Level bonus
            updateUI();
        }

        function updateUI() {
            document.getElementById('lives-display').innerText = player.lives;
            document.getElementById('score-display').innerText = player.score;
            document.getElementById('bomb-display').innerText = `${player.maxBombs - bombs.length}/${player.maxBombs}`;
        }

        function hideScreens() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-over-screen').classList.add('hidden');
            document.getElementById('level-complete-screen').classList.add('hidden');
        }

        let shakeTime = 0;
        function createScreenShake() {
            shakeTime = 15;
        }

        function applyShake() {
            if (shakeTime > 0) {
                let dx = (Math.random() - 0.5) * 10;
                let dy = (Math.random() - 0.5) * 10;
                ctx.translate(dx, dy);
                shakeTime--;
            }
        }

        function createDebris(gridX, gridY, color = '#795548') {
            for (let i = 0; i < 8; i++) {
                let p = document.createElement('div');
                p.style.position = 'absolute';
                p.style.width = '8px';
                p.style.height = '8px';
                p.style.backgroundColor = color;
                p.style.left = `${(gridX + 0.5) * CELL_SIZE}px`;
                p.style.top = `${(gridY + 0.5) * CELL_SIZE}px`;
                
                // Random velocities
                let vx = (Math.random() - 0.5) * 100;
                let vy = (Math.random() - 0.5) * 100 - 50; // Bias upwards
                
                particlesContainer.appendChild(p);
                
                particles.push({
                    el: p,
                    x: (gridX + 0.5) * CELL_SIZE,
                    y: (gridY + 0.5) * CELL_SIZE,
                    vx: vx, vy: vy,
                    life: 1,
                    decay: Math.random() * 0.05 + 0.02
                });
            }
        }
        
        function createTextEffect(gridX, gridY, text, color) {
             let p = document.createElement('div');
                p.style.position = 'absolute';
                p.style.color = color;
                p.style.fontWeight = 'bold';
                p.style.fontSize = '20px';
                p.style.textShadow = '1px 1px 0 #000';
                p.style.pointerEvents = 'none';
                p.innerText = text;
                p.style.left = `${gridX * CELL_SIZE}px`;
                p.style.top = `${gridY * CELL_SIZE}px`;
                
                particlesContainer.appendChild(p);
                
                particles.push({
                    el: p,
                    x: gridX * CELL_SIZE,
                    y: gridY * CELL_SIZE,
                    vx: 0, vy: -30, // Float up
                    life: 1.5,
                    decay: 0.02
                });
        }

        function updateParticles(dt) {
            let dtSec = dt / 1000;
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dtSec;
                p.y += p.vy * dtSec;
                p.vy += 150 * dtSec; // Gravity
                p.life -= p.decay;
                
                if (p.life <= 0) {
                    if (p.el.parentNode) p.el.parentNode.removeChild(p.el);
                    particles.splice(i, 1);
                } else {
                    p.el.style.left = `${p.x}px`;
                    p.el.style.top = `${p.y}px`;
                    p.el.style.opacity = p.life;
                    p.el.style.transform = `scale(${p.life})`;
                }
            }
        }

        // Drawing functions
        function drawRoundedRect(ctx, x, y, width, height, radius, fillStyle, strokeStyle, lineWidth) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            if (fillStyle) {
                ctx.fillStyle = fillStyle;
                ctx.fill();
            }
            if (strokeStyle) {
                ctx.lineWidth = lineWidth || 1;
                ctx.strokeStyle = strokeStyle;
                ctx.stroke();
            }
        }

        function drawWall(x, y) {
            const cs = CELL_SIZE;
            const px = x * cs;
            const py = y * cs;
            
            // Base shadow
            ctx.fillStyle = '#3e2723';
            ctx.fillRect(px, py, cs, cs);
            
            // Beveled edge
            ctx.fillStyle = 'var(--wall-color)';
            ctx.fillRect(px + 2, py + 2, cs - 4, cs - 4);
            
            // Highlight
            ctx.fillStyle = '#6d4c41';
            ctx.fillRect(px + 2, py + 2, cs - 4, 4);
            ctx.fillRect(px + 2, py + 2, 4, cs - 4);
        }

        function drawBlock(x, y) {
            const cs = CELL_SIZE;
            const px = x * cs;
            const py = y * cs;
            
            ctx.fillStyle = 'var(--destructible-color)';
            ctx.fillRect(px + 1, py + 1, cs - 2, cs - 2);
            
            // Brick pattern
            ctx.fillStyle = '#5d4037';
            ctx.fillRect(px + 1, py + cs/2, cs-2, 2); // horizontal line
            ctx.fillRect(px + cs/2, py + 1, 2, cs/2); // vert top
            ctx.fillRect(px + cs/4, py + cs/2, 2, cs/2); // vert bottom left
            ctx.fillRect(px + (cs*3)/4, py + cs/2, 2, cs/2); // vert bottom right
            
            // Highlight
            ctx.fillStyle = 'rgba(255,255,255,0.1)';
            ctx.fillRect(px + 1, py + 1, cs - 2, 4);
        }
        
        function drawPlayer() {
            if (player.dead) return;
            
            // Blinking if invulnerable
            if (player.invulnerableTime > 0 && Math.floor(Date.now() / 100) % 2 === 0) return;

            const cs = CELL_SIZE;
            const px = player.x * cs;
            const py = player.y * cs;
            const pw = player.width * cs;
            const ph = player.height * cs;
            
            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.4)';
            ctx.beginPath();
            ctx.ellipse(px + pw/2, py + ph, pw/2, ph/4, 0, 0, Math.PI * 2);
            ctx.fill();

            // Head (Helmet)
            ctx.fillStyle = 'white';
            drawRoundedRect(ctx, px, py - 5, pw, ph * 0.7, 8, 'white', '#ccc', 2);
            
            // Visor
            ctx.fillStyle = '#111';
            ctx.fillRect(px + 4, py + 2, pw - 8, ph * 0.3);
            // Visor reflection
            ctx.fillStyle = '#444';
            ctx.fillRect(px + 6, py + 4, pw - 18, 2);

            // Body
            ctx.fillStyle = 'var(--player-color)';
            drawRoundedRect(ctx, px + 4, py + ph * 0.5 - 5, pw - 8, ph * 0.5, 4, 'var(--player-color)');
            
            // Antenna
            ctx.fillStyle = '#ff4081';
            ctx.beginPath();
            ctx.arc(px + pw/2, py - 10, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(px + pw/2, py - 10);
            ctx.lineTo(px + pw/2, py - 5);
            ctx.stroke();

            // Eyes based on direction (simple dot)
            ctx.fillStyle = 'white';
            if(player.direction === 'right') {
                ctx.fillRect(px + pw - 12, py + 4, 3, 4);
            } else if (player.direction === 'left') {
                ctx.fillRect(px + 8, py + 4, 3, 4);
            } else if (player.direction === 'down') {
                ctx.fillRect(px + 8, py + 4, 3, 4);
                ctx.fillRect(px + pw - 12, py + 4, 3, 4);
            }
            
            // Bobbing animation if moving
            if(player.isMoving) {
                ctx.translate(0, Math.sin(Date.now() / 50) * 2);
            }
        }

        function render() {
            // Clear canvas
            ctx.fillStyle = 'var(--floor-color)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add grid pattern to floor
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for (let i = 0; i < GRID_SIZE; i++) {
                for (let j = 0; j < GRID_SIZE; j++) {
                    if ((i + j) % 2 === 0) {
                        ctx.fillRect(i * CELL_SIZE, j * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                }
            }

            ctx.save();
            applyShake();

            // 1. Draw Map (Walls, Blocks, Exit, Powerups)
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    let tile = map[y][x];
                    let px = x * CELL_SIZE;
                    let py = y * CELL_SIZE;

                    // Exit
                    if (exitPos.x === x && exitPos.y === y && exitPos.revealed) {
                        ctx.fillStyle = '#4CAF50';
                        ctx.fillRect(px + 4, py + 4, CELL_SIZE - 8, CELL_SIZE - 8);
                        ctx.fillStyle = 'white';
                        ctx.font = 'bold 20px Arial';
                        ctx.textAlign = 'center';
                        ctx.fillText('EXIT', px + CELL_SIZE/2, py + CELL_SIZE/2 + 7);
                    }

                    // Powerups
                    for (let p of powerups) {
                        if (p.x === x && p.y === y && p.revealed) {
                            ctx.fillStyle = 'rgba(0,0,0,0.3)';
                            ctx.beginPath();
                            ctx.ellipse(px + CELL_SIZE/2, py + CELL_SIZE - 4, 10, 4, 0, 0, Math.PI*2);
                            ctx.fill();
                            
                            ctx.font = '24px Arial';
                            ctx.textAlign = 'center';
                            let floatOffset = Math.sin(Date.now()/200) * 3;
                            if (p.type === TILE_POWERUP_BOMB) ctx.fillText('💣', px + CELL_SIZE/2, py + CELL_SIZE/2 + 8 + floatOffset);
                            if (p.type === TILE_POWERUP_FLAME) ctx.fillText('🔥', px + CELL_SIZE/2, py + CELL_SIZE/2 + 8 + floatOffset);
                        }
                    }

                    if (tile === TILE_WALL) drawWall(x, y);
                    if (tile === TILE_BLOCK) drawBlock(x, y);
                }
            }

            // 2. Draw Bombs
            for (let b of bombs) {
                let px = b.x * CELL_SIZE + CELL_SIZE / 2;
                let py = b.y * CELL_SIZE + CELL_SIZE / 2;
                let scale = 1 + Math.sin(b.breatheOffset * 20) * 0.1; // pulsing effect
                
                // Color gets redder as timer goes down
                let redAmt = Math.max(0, 1 - (b.timer / 3000));
                
                ctx.save();
                ctx.translate(px, py);
                ctx.scale(scale, scale);
                
                // Bomb body
                ctx.fillStyle = `rgb(${Math.floor(30 + redAmt*200)}, 30, 30)`;
                ctx.beginPath();
                ctx.arc(0, 0, CELL_SIZE * 0.4, 0, Math.PI * 2);
                ctx.fill();
                
                // Highlight
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.beginPath();
                ctx.arc(-CELL_SIZE*0.15, -CELL_SIZE*0.15, CELL_SIZE * 0.1, 0, Math.PI * 2);
                ctx.fill();
                
                // Spark
                let sparkToggle = Math.floor(Date.now() / 50) % 2 === 0;
                if(sparkToggle) {
                    ctx.fillStyle = '#ffeb3b';
                    ctx.beginPath();
                    ctx.arc(0, -CELL_SIZE*0.4, 4, 0, Math.PI*2);
                    ctx.fill();
                }

                ctx.restore();
            }

            // 3. Draw Enemies
            for (let en of entities) {
                if (en.dead) continue;
                let px = en.x * CELL_SIZE;
                let py = en.y * CELL_SIZE;
                let w = en.width * CELL_SIZE;
                let h = en.height * CELL_SIZE;
                
                // Bobbing
                let bob = Math.sin(Date.now() / 150 + en.x) * 2;
                
                // Body (Balloon style)
                ctx.fillStyle = 'var(--enemy-color)';
                ctx.beginPath();
                ctx.ellipse(px + w/2, py + h/2 + bob, w/2, h/2, 0, 0, Math.PI*2);
                ctx.fill();
                
                // Eyes
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(px + w*0.3, py + h*0.4 + bob, 4, 0, Math.PI*2);
                ctx.arc(px + w*0.7, py + h*0.4 + bob, 4, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = 'black';
                ctx.beginPath();
                let eyeOffset = en.direction === 'h' ? (en.velX > 0 ? 1 : -1) : 0;
                ctx.arc(px + w*0.3 + eyeOffset, py + h*0.4 + bob, 2, 0, Math.PI*2);
                ctx.arc(px + w*0.7 + eyeOffset, py + h*0.4 + bob, 2, 0, Math.PI*2);
                ctx.fill();
            }

            // 4. Draw Player
            ctx.save();
            drawPlayer();
            ctx.restore(); // restore from bobbing translation

            // 5. Draw Explosions
            for (let e of explosions) {
                // Flicker effect
                let colors = ['#fff59d', '#ffeb3b', '#fbc02d', '#f44336'];
                let colIdx = Math.floor(Math.random() * colors.length);
                
                for (let cell of e.cells) {
                    let px = cell.x * CELL_SIZE;
                    let py = cell.y * CELL_SIZE;
                    
                    ctx.fillStyle = colors[colIdx];
                    // Core shape
                    ctx.fillRect(px, py, CELL_SIZE, CELL_SIZE);
                    
                    // Inner bright core
                    ctx.fillStyle = 'white';
                    ctx.fillRect(px + CELL_SIZE*0.2, py + CELL_SIZE*0.2, CELL_SIZE*0.6, CELL_SIZE*0.6);
                }
            }

            ctx.restore(); // Restore from shake
        }

        function gameLoop(timestamp) {
            let dt = timestamp - lastTime;
            lastTime = timestamp;

            // Cap dt to prevent massive jumps if tab is inactive
            if (dt > 100) dt = 16; 

            if (gameState === 'PLAYING') {
                updatePlayer(dt);
                updateBombs(dt);
                updateExplosions(dt);
                updateEnemies(dt);
            }
            
            updateParticles(dt);
            render();

            animationId = requestAnimationFrame(gameLoop);
        }

        // Start everything
        window.onload = init;

    </script>
</body>
